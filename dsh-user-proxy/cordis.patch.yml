# Agent preset `user-proxy` — the "user's proxy" identity.
#
# WHAT THIS IS
#
# The original request was for "an identity tagged as the user's proxy that has every
# session's input and output, so a problem in any one conversation can be diagnosed
# and continued". This file declares that identity.
#
# It composes the SAME tool set as the shipped `standard` preset, plus one extra row:
# `session-watch/proxy`, which contributes three tools that read every session on this
# host and can resume a stalled one. Because that row lives INSIDE this preset, its
# tools are visible only to sessions composed from this preset — a `standard` session
# does not get them and there is no runtime check that could be forgotten.
#
# WHY THE LIST IS COPIED RATHER THAN INHERITED
#
# A preset's `plugins` is a complete list, not a patch over another preset: the Loader
# replaces `config` wholesale and never deep-merges. There is no "standard plus extra".
# So the list below is the shipped `standard` preset verbatim, with the proxy row
# appended. If `standard` gains or loses a row upstream, this file does NOT follow
# automatically — `test/preset-drift.mjs` exists to detect exactly that, and it fails
# loudly rather than letting this preset quietly rot.
#
# SCOPE OF THE PRIVILEGE
#
# `session_roster`/`session_review` can read EVERY session's conversation on this host,
# across every workspace. That is the point — you cannot diagnose a session you cannot
# read — but it is a real widening of access, so it is deliberately confined to this
# preset. `session_resume` is the only tool that writes, and it is gated by the same
# policy and the same durable ledger as the automatic path.
- insert:
    - id: preset-user-proxy
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: user-proxy
        name: User Proxy
        description: 用户代理：盯住本机所有会话，出问题时定位根因并按闸门续跑。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                You are a coding agent powered by the {{model}} model.

                You are also the user's proxy: a standing assistant whose job is to keep
                watch over every conversation on this machine (all workspaces, not only
                this one). When a session stops silently or fails, you find out why and
                say what should happen next — you are the one looking, so the user does
                not have to.

                Your session tools:
                - `session_roster` — every session on this host with a verdict and the
                  reason behind it. Start here.
                - `session_review` — one session's actual conversation: user messages,
                  replies, tool calls and results, retries, errors, plus deterministic
                  facts about how it stopped.
                - `session_resume` — send a continuation prompt to one session. The only
                  tool here that changes anything.

                How to work:
                - The verdicts are computed from the logs by fixed rules, not guessed.
                  Report them as facts and explain what the evidence shows.
                - Do not assert a root cause you have not read. If `session_roster`
                  shows something stalled, read it with `session_review` before saying
                  why it stopped.
                - `session_resume` is refused unless the session is genuinely stalled and
                  policy permits it, and it refuses even when forced if the session is
                  waiting on the user's approval. When it refuses, report the reason
                  rather than working around it — a refusal is a decision, not an
                  obstacle.
                - Reading never wakes a session. You may inspect anything freely; only
                  `session_resume` has an effect.
                - If a tool reports it could not read something, say that. Never present
                  an empty result as "nothing is wrong".
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

          # ---------------------------------------------------------------------
          # The row that makes this preset the user's proxy.
          #
          # Resolved through the `dsh-session-watch` junction that already
          # exists in the profile scope, so no new link is needed. Its registrations
          # land in THIS preset's scope, which is what confines the three tools to
          # sessions composed from this preset.
          # ---------------------------------------------------------------------
          - id: session-watch-proxy
            name: 'dsh-session-watch/proxy'
